<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Craft Setu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.js"></script>
<style>
  :root{
    --cream: #faf5e8; --cream-deep: #f2e9d6; --paper: #fffdf8;
    --sage: #6f9273; --sage-deep: #4f7355; --sage-dark: #2f4a35;
    --sage-line: #a9c2a4; --gold: #c39a4d; --ink: #33422f;
    --ink-soft: #5c6b57; --error: #b3543f;
    --shadow: 0 20px 45px -20px rgba(47,74,53,.35);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Jost', sans-serif; background:var(--cream); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px; position:relative; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background-image:radial-gradient(circle at 2px 2px, rgba(111,146,115,.09) 1.4px, transparent 1.4px);
    background-size:26px 26px; pointer-events:none;
  }
  a{ text-decoration:none; color:inherit; }
  h1{ font-family:'Cormorant Garamond', serif; color:var(--sage-dark); font-weight:600; }
  .top-logo{
    position:fixed; top:26px; left:28px; display:flex; align-items:center; gap:10px; z-index:5;
  }
  .top-logo svg{ width:36px; height:36px; }
  .top-logo span{ font-family:'Cormorant Garamond', serif; font-size:1.4rem; font-weight:700; color:var(--sage-dark); }
  .top-logo em{ font-style:italic; color:var(--gold); font-weight:600; }
  .auth-wrap{ position:relative; width:100%; max-width:420px; }
  .auth-card{
    background:var(--paper); border:1px solid var(--sage-line); border-radius:26px;
    padding:44px 38px 38px; box-shadow:var(--shadow);
  }
  .eyebrow{
    display:flex; align-items:center; gap:10px; font-size:.78rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--sage-deep); margin-bottom:14px; justify-content:center;
  }
  .eyebrow::before,.eyebrow::after{ content:""; width:20px; height:1px; background:var(--gold); }
  .auth-card h1{ font-size:2rem; text-align:center; margin-bottom:8px; }
  .auth-card > p.sub{ text-align:center; color:var(--ink-soft); font-size:.94rem; margin-bottom:30px; }
  .tabs{ display:flex; background:var(--cream-deep); border-radius:999px; padding:4px; margin-bottom:26px; }
  .tabs button{
    flex:1; border:none; background:transparent; padding:10px 0; border-radius:999px;
    font-family:'Jost', sans-serif; font-size:.9rem; font-weight:500; color:var(--ink-soft); cursor:pointer;
    transition:background .25s, color .25s, box-shadow .25s;
  }
  .tabs button.active{ background:var(--paper); color:var(--sage-dark); box-shadow:0 6px 14px -8px rgba(47,74,53,.35); }
  form{ display:flex; flex-direction:column; gap:16px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:.82rem; color:var(--ink-soft); }
  .field input{
    font-family:'Jost', sans-serif; font-size:.95rem; padding:13px 16px; border-radius:12px;
    border:1.4px solid var(--sage-line); background:var(--cream); color:var(--ink); outline:none;
  }
  .field input:focus{ border-color:var(--sage); box-shadow:0 0 0 3px rgba(111,146,115,.18); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Jost', sans-serif; font-size:.95rem; font-weight:500; padding:13px 22px;
    border-radius:999px; cursor:pointer; border:none; width:100%;
    transition:transform .2s, box-shadow .2s, opacity .2s;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--sage), var(--sage-deep)); color:#fbf8ef;
    box-shadow:0 12px 24px -10px rgba(79,115,85,.55); margin-top:4px;
  }
  .btn-primary:hover{ transform:translateY(-2px); }
  .btn-primary:disabled{ opacity:.65; cursor:not-allowed; transform:none; }
  .msg{ display:none; font-size:.85rem; padding:11px 14px; border-radius:10px; line-height:1.5; }
  .msg.error{ display:block; background:#f6e4e0; color:var(--error); border:1px solid #e3bfb5; }
  .msg.success{ display:block; background:#e7f0e6; color:var(--sage-deep); border:1px solid var(--sage-line); }
  .switch-line{ text-align:center; margin-top:22px; font-size:.88rem; color:var(--ink-soft); }
  .switch-line a{ color:var(--sage-deep); font-weight:500; }
  .back-home{ display:block; text-align:center; margin-top:22px; font-size:.86rem; color:var(--ink-soft); }
  .config-warn{
    background:#fff3cd; border:1px solid #e6d28a; color:#6b5a1e; font-size:.8rem;
    padding:10px 12px; border-radius:10px; margin-bottom:16px; line-height:1.45;
  }
  @media (max-width:480px){
    .auth-card{ padding:36px 24px 30px; }
    .top-logo{ position:static; justify-content:center; margin-bottom:26px; }
  }
</style>
</head>
<body>
<a href="index.html" class="top-logo">
  <svg viewBox="0 0 60 60" fill="none"><path d="M8 40C8 40 8 26 30 26C52 26 52 40 52 40" stroke="#6f9273" stroke-width="2.5" stroke-linecap="round"/><path d="M14 40V30M22 40V27M30 40V26M38 40V27M46 40V30" stroke="#c39a4d" stroke-width="1.6" stroke-linecap="round"/><circle cx="30" cy="14" r="3" fill="#c39a4d"/><path d="M6 44H54" stroke="#2f4a35" stroke-width="2.5" stroke-linecap="round"/></svg>
  <span>Craft <em>Setu</em></span>
</a>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="eyebrow">Welcome back</div>
    <h1 id="cardTitle">Log In to Craft Setu</h1>
    <p class="sub" id="cardSub">Continue your craft journey with your community.</p>
    <div id="configWarn" class="config-warn" style="display:none;">
      Set your <b>Appwrite Project ID</b> in <code>login.html</code> and <code>app.html</code> (search for <code>APPWRITE_PROJECT_ID</code>).
    </div>
    <div class="tabs">
      <button type="button" class="active" id="tabLogin">Log In</button>
      <button type="button" id="tabSignup">Sign Up</button>
    </div>
    <div id="msgBox" class="msg"></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="At least 8 characters" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginSubmitBtn">Log In</button>
    </form>
    <form id="signupForm" style="display:none;">
      <div class="field">
        <label for="signupName">Full name</label>
        <input type="text" id="signupName" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="At least 8 characters" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" id="signupSubmitBtn">Create Account</button>
    </form>
    <p class="switch-line" id="switchLine">
      Don't have an account? <a href="#" id="switchToSignup">Sign up</a>
    </p>
    <a href="index.html" class="back-home">← Back to home</a>
  </div>
</div>
<script>
  // ========== APPWRITE CONFIG (client-safe — NO secret API key) ==========
  const APPWRITE_ENDPOINT = 'https://sgp.cloud.appwrite.io/v1';
  const APPWRITE_PROJECT_ID = '6a75f75400350e8fd788'; // ← paste Project ID from Appwrite Console → Settings
  // ======================================================================

  const { Client, Account, ID } = Appwrite;

  const client = new Client()
    .setEndpoint(APPWRITE_ENDPOINT)
    .setProject(APPWRITE_PROJECT_ID);

  const account = new Account(client);

  if (!APPWRITE_PROJECT_ID || APPWRITE_PROJECT_ID === 'YOUR_PROJECT_ID') {
    document.getElementById('configWarn').style.display = 'block';
  }

  // Already logged in?
  account.get().then(() => {
    window.location.replace('app.html');
  }).catch(() => { /* stay on login */ });

  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const cardTitle = document.getElementById('cardTitle');
  const cardSub = document.getElementById('cardSub');
  const switchLine = document.getElementById('switchLine');
  const msgBox = document.getElementById('msgBox');
  const loginSubmitBtn = document.getElementById('loginSubmitBtn');
  const signupSubmitBtn = document.getElementById('signupSubmitBtn');

  function showMessage(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'msg ' + type;
  }
  function clearMessage() {
    msgBox.className = 'msg';
    msgBox.textContent = '';
  }
  function showLogin() {
    tabLogin.classList.add('active');
    tabSignup.classList.remove('active');
    loginForm.style.display = 'flex';
    signupForm.style.display = 'none';
    cardTitle.textContent = 'Log In to Craft Setu';
    cardSub.textContent = 'Continue your craft journey with your community.';
    switchLine.innerHTML = 'Don\'t have an account? <a href="#" id="switchToSignup">Sign up</a>';
    document.getElementById('switchToSignup').addEventListener('click', (e) => { e.preventDefault(); showSignup(); });
    clearMessage();
  }
  function showSignup() {
    tabSignup.classList.add('active');
    tabLogin.classList.remove('active');
    signupForm.style.display = 'flex';
    loginForm.style.display = 'none';
    cardTitle.textContent = 'Join Craft Setu';
    cardSub.textContent = 'Create an account to share and explore handmade art.';
    switchLine.innerHTML = 'Already have an account? <a href="#" id="switchToLogin">Log in</a>';
    document.getElementById('switchToLogin').addEventListener('click', (e) => { e.preventDefault(); showLogin(); });
    clearMessage();
  }
  tabLogin.addEventListener('click', showLogin);
  tabSignup.addEventListener('click', showSignup);
  document.getElementById('switchToSignup').addEventListener('click', (e) => { e.preventDefault(); showSignup(); });

  function friendlyError(err) {
    const msg = (err && err.message) ? err.message : 'Something went wrong.';
    if (/Invalid credentials|user_invalid_credentials/i.test(msg)) return 'Incorrect email or password.';
    if (/already exists|user_already_exists/i.test(msg)) return 'An account already exists with that email.';
    if (/password/i.test(msg) && /8/i.test(msg)) return 'Password must be at least 8 characters.';
    if (/project/i.test(msg) && /not found|invalid/i.test(msg)) return 'Invalid Project ID — update APPWRITE_PROJECT_ID in the code.';
    return msg;
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessage();
    if (APPWRITE_PROJECT_ID === 'YOUR_PROJECT_ID') {
      showMessage('Set APPWRITE_PROJECT_ID first (see yellow box).', 'error');
      return;
    }
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    loginSubmitBtn.disabled = true;
    loginSubmitBtn.textContent = 'Logging in…';
    try {
      try {
        await account.createEmailPasswordSession({ email, password });
      } catch (e1) {
        await account.createEmailPasswordSession(email, password);
      }
      // Confirm session exists before redirect (avoids bounce loop)
      await account.get();
      showMessage('Logged in! Redirecting…', 'success');
      setTimeout(() => { window.location.replace('app.html'); }, 400);
    } catch (err) {
      console.error(err);
      showMessage(friendlyError(err), 'error');
    } finally {
      loginSubmitBtn.disabled = false;
      loginSubmitBtn.textContent = 'Log In';
    }
  });

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessage();
    if (APPWRITE_PROJECT_ID === 'YOUR_PROJECT_ID') {
      showMessage('Set APPWRITE_PROJECT_ID first (see yellow box).', 'error');
      return;
    }
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    signupSubmitBtn.disabled = true;
    signupSubmitBtn.textContent = 'Creating account…';
    try {
      try {
        await account.create({ userId: ID.unique(), email, password, name });
      } catch (e1) {
        await account.create(ID.unique(), email, password, name);
      }
      try {
        await account.createEmailPasswordSession({ email, password });
      } catch (e2) {
        await account.createEmailPasswordSession(email, password);
      }
      await account.get();
      showMessage('Account created! Redirecting…', 'success');
      setTimeout(() => { window.location.replace('app.html'); }, 400);
    } catch (err) {
      console.error(err);
      showMessage(friendlyError(err), 'error');
    } finally {
      signupSubmitBtn.disabled = false;
      signupSubmitBtn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
